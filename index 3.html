<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kristallvätska · Ringtest 7</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 42% 45%,#14213c,#050714 75%);color:#e7eaf5;font:15px system-ui,Arial;min-height:100vh}.wrap{display:flex;align-items:center;justify-content:center;gap:4vw;min-height:100vh;padding:24px;flex-wrap:wrap}canvas{width:min(70vw,690px);height:auto;max-width:100%;aspect-ratio:1}.panel{background:#101625e8;border:1px solid #56627a;border-radius:20px;padding:24px;width:290px;box-shadow:0 20px 60px #0007}h2{font-size:19px;margin:0 0 5px}p{color:#aebbd1;font-size:12px;line-height:1.5}label{display:flex;justify-content:space-between;margin:19px 0 6px;font-size:13px}input{width:100%;accent-color:#d68dca}button{background:#303c58;color:white;border:1px solid #7783a0;padding:10px;border-radius:9px;margin-top:16px}small{color:#a9b5ce;display:block;margin-top:15px}@media(max-width:850px){.wrap{gap:0;padding:12px}canvas{width:min(94vw,590px)}.panel{width:min(94vw,430px)}}</style><div class="wrap"><canvas id="ring" width="1000" height="1000"></canvas><div class="panel"><h2>💎 Kristallvätska · Test 7</h2><p>Stillbildsstudie: organiska vätskeströmmar, glasdjup och mjuka ljusreflexer. Ingen animation ännu.</p><label>Fyllnadsgrad <output id="fillOut">75 %</output></label><input id="fill" type="range" min="0" max="100" value="75"><label>Färgtäckning <output id="colorOut">100 %</output></label><input id="color" type="range" min="0" max="100" value="100"><label>Glöd <output id="glowOut">60 %</output></label><input id="glow" type="range" min="0" max="100" value="60"><label>Ringens tjocklek <output id="thickOut">55 %</output></label><input id="thick" type="range" min="0" max="100" value="55"><button id="reset">Återställ</button><small>Vid 0 % färgtäckning syns bara glaset. Färgen ligger inuti glasröret, inte som separata LED-streck.</small></div></div><script>
const canvas=document.getElementById('ring'),ctx=canvas.getContext('2d');let state={fill:75,color:100,glow:60,thick:55};const TAU=Math.PI*2, cx=500,cy=500,R=340;function arc(r,a,b){ctx.beginPath();ctx.arc(cx,cy,r,a,b)}function stroke(r,a,b,w,style){ctx.lineWidth=w;ctx.strokeStyle=style;ctx.lineCap='round';arc(r,a,b);ctx.stroke()}function grad(x1,y1,x2,y2,stops){let g=ctx.createLinearGradient(x1,y1,x2,y2);stops.forEach(([p,c])=>g.addColorStop(p,c));return g}function render(){ctx.clearRect(0,0,1000,1000);let thick=48+state.thick*.45,outer=R+thick/2,inner=R-thick/2;ctx.save();ctx.shadowBlur=48;ctx.shadowColor='#5b82d455';stroke(R,0,TAU,thick+8,'#101c37');ctx.restore();stroke(R,0,TAU,thick+9,'#34435c');stroke(R,0,TAU,thick+3,grad(0,130,1000,880,[[0,'#172338'],[.23,'#3c536b'],[.5,'#10182c'],[.75,'#30405d'],[1,'#0b1326']]));
// Refractive glass wall, continuous fine rim highlights.
stroke(outer+4,0,TAU,2.7,'#a5d7ff9c');stroke(inner-4,0,TAU,2.8,'#95c7ee86');stroke(outer-2,0,TAU,1.4,'#f5fbff8a');stroke(inner+2,0,TAU,1.2,'#d8e8ff56');
let start=-Math.PI/2,end=start+TAU*state.fill/100; if(state.fill>0&&state.color>0){ctx.save();ctx.beginPath();ctx.arc(cx,cy,outer-6,0,TAU);ctx.arc(cx,cy,inner+6,0,TAU,true);ctx.clip('evenodd');let opacity=state.color/100;ctx.globalAlpha=opacity;let n=330;for(let i=0;i<n;i++){let a=start+(end-start)*i/n,b=start+(end-start)*(i+1.5)/n;let mid=(a+b)/2;let palette=[['#03d8fa','#1677ff'],['#157aff','#9634ed'],['#ba29f0','#fb40bc'],['#f55c99','#ffb34d'],['#ffab40','#e64a5d'],['#ae3de8','#14c9f5']];let t=(i/n)*palette.length,idx=Math.min(palette.length-1,Math.floor(t));let radial=ctx.createRadialGradient(cx+Math.cos(mid)*(R-15),cy+Math.sin(mid)*(R-15),4,cx+Math.cos(mid)*R,cy+Math.sin(mid)*R,thick*.9);radial.addColorStop(0,palette[idx][0]);radial.addColorStop(.55,palette[idx][1]);radial.addColorStop(1,'#051b53');ctx.lineWidth=thick-14;ctx.strokeStyle=radial;ctx.lineCap='butt';arc(R,a,b);ctx.stroke()}
// Fluid ribbons with broad translucent, tapering, non-parallel organic folds.
for(let j=0;j<7;j++){let a0=start+.11+j*.60,span=.52+.18*Math.sin(j*1.7),a1=Math.min(end,a0+span);if(a1<=a0)continue;ctx.beginPath();for(let k=0;k<=55;k++){let t=k/55,a=a0+(a1-a0)*t,rad=R+(thick*.23)*Math.sin(t*Math.PI*2+j*1.8)+thick*.12*Math.sin(t*8+j);let x=cx+rad*Math.cos(a),y=cy+rad*Math.sin(a);k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=['#9befff7a','#f6a6f17c','#fff3cc69','#a6caff6c'][j%4];ctx.lineWidth=(7+9*Math.sin(j*2)**2);ctx.lineCap='round';ctx.shadowBlur=16;ctx.shadowColor=ctx.strokeStyle;ctx.stroke()}ctx.shadowBlur=0;
// Glass-embedded bubbles with refraction.
for(let j=0;j<9;j++){let a=start+.22+j*.43;if(a>end-.07)break;let rr=R+Math.sin(j*3.7)*thick*.24,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr,br=3+(j%3)*3;let g=ctx.createRadialGradient(x-br*.3,y-br*.4,1,x,y,br);g.addColorStop(0,'#d7f9ff8c');g.addColorStop(.4,'#82cfff33');g.addColorStop(1,'#c8efff08');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,br,0,TAU);ctx.fill();ctx.strokeStyle='#d8f7ff83';ctx.lineWidth=1;ctx.stroke()}
ctx.restore();}
// Highlights sit on the outer glass and remain even with no liquid.
ctx.save();ctx.shadowColor='#e4f5ff';ctx.shadowBlur=state.glow*.22;stroke(outer-3,-2.35,-1.55,5.2,'#f5faffd8');stroke(outer-7,-2.37,-1.65,2.4,'#b7e5fff0');stroke(inner+4,.35,1.0,2.5,'#a6d8f6b5');stroke(outer-3,1.85,2.32,2.8,'#fff1f8c0');stroke(inner+4,3.75,4.25,2,'#d9f6ffac');ctx.restore();if(state.fill>0&&state.color>0&&state.glow>0){ctx.save();ctx.globalAlpha=state.color/100;ctx.shadowBlur=state.glow*.48;ctx.shadowColor='#4ab8ff';stroke(outer-8,start,end,2.2,'#7dc9ff88');ctx.restore()}
}for(let id of Object.keys(state)){let e=document.getElementById(id);e.addEventListener('input',()=>{state[id]=+e.value;document.getElementById(id+'Out').textContent=e.value+' %';render()})}document.getElementById('reset').onclick=()=>{state={fill:75,color:100,glow:60,thick:55};for(let id in state){document.getElementById(id).value=state[id];document.getElementById(id+'Out').textContent=state[id]+' %'}render()};render();
</script></html>
