<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kristallvätska – Ringtest 4</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 42% 38%,#1a2440,#060811 75%);color:#f5f4ff;font:15px system-ui,-apple-system,sans-serif}.layout{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:20px;padding:16px}canvas{width:min(66vw,81vh);height:auto;aspect-ratio:1}aside{width:305px;max-width:100%;padding:21px;background:#141726ed;border:1px solid #ffffff36;border-radius:19px}h2{margin:0 0 8px;font-size:21px}p,.note{color:#b0b9d0;font-size:12px;line-height:1.5}p{margin:0 0 16px}label{display:flex;justify-content:space-between;margin:15px 0 7px}output{color:#f2a9d9}input[type=range]{width:100%;accent-color:#e6a1d5}button{margin:10px 5px 0 0;padding:10px 12px;border-radius:9px;background:#30364c;color:white;border:1px solid #ffffff55}.note{margin-top:17px}@media(max-width:850px){.layout{flex-direction:column;padding:12px;gap:3px}canvas{width:min(96vw,62vh)}aside{width:min(96vw,460px);padding:17px}}</style></head><body><div class="layout"><canvas id="c" width="800" height="800"></canvas><aside><h2>💎 Kristallvätska · Test 4</h2><p>Organiska färgmoln i ett stilla kristallglasrör</p><div id="controls"></div><button id="play">▶ Testa nedräkning</button><button id="reset">↺ Återställ</button><div class="note">Test 4: sammanhängande färgvätska i stället för parallella band. Färgmolnen sträcks, möts och glider isär. Glaset finns kvar när tiden är slut. 0 % färg = färglöst glas.</div></aside></div><script>
const defs=[['fill','Tid kvar / vätska',75],['color','Färgtäckning',100],['motion','Vätskans rörelse',55],['glow','Glöd',45],['thick','Ringens tjocklek',55]],state={},inputs={},controls=document.getElementById('controls');for(const [id,name,v] of defs){state[id]=v;let l=document.createElement('label'),s=document.createElement('span'),o=document.createElement('output');s.textContent=name;o.id='o_'+id;o.textContent=v+' %';l.append(s,o);let x=document.createElement('input');x.type='range';x.min=0;x.max=100;x.value=v;x.addEventListener('input',()=>{state[id]=+x.value;o.textContent=x.value+' %'});inputs[id]=x;controls.append(l,x)}let playing=false;const play=document.getElementById('play');play.onclick=()=>{if(state.fill===0){state.fill=100;inputs.fill.value=100}playing=!playing;play.textContent=playing?'⏸ Pausa':'▶ Testa nedräkning'};document.getElementById('reset').onclick=()=>{playing=false;play.textContent='▶ Testa nedräkning';for(const [id,,v] of defs){state[id]=v;inputs[id].value=v;document.getElementById('o_'+id).textContent=v+' %'}};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),TAU=Math.PI*2,C=400,START=-Math.PI/2;let phase=0,last=0,lastFrame=0;const palette=[[15,224,228],[46,103,255],[143,58,255],[251,56,170],[255,166,52],[30,217,182]];function clamp(x,a=0,b=1){return Math.max(a,Math.min(b,x))}function arc(r,w,a,b,col){ctx.beginPath();ctx.arc(C,C,r,a,b);ctx.lineWidth=w;ctx.lineCap='butt';ctx.strokeStyle=col;ctx.stroke()}function rgba(c,a){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${clamp(a)})`}
// A continuous two-dimensional pigment field, not individually animated concentric bands.
// Six slowly morphing Gaussian clouds share a single volume inside the glass tube.
function pigment(theta,rad,t){let weights=[],sum=0;for(let k=0;k<6;k++){const center=k/6+.058*Math.sin(t*.28+k*1.73)+.025*Math.sin(t*.53+k*2.7);let d=Math.abs(theta-center);d=Math.min(d,1-d);const radialCenter=.5+.30*Math.sin(t*.33+k*2.15+theta*8)+.11*Math.sin(t*.59-k*1.4);const angularWidth=.12+.028*Math.sin(t*.27+k);const radialWidth=.34+.07*Math.sin(t*.4+k*1.9);let w=Math.exp(-.5*(d/angularWidth)**2-.5*((rad-radialCenter)/radialWidth)**2);weights.push(w);sum+=w}let base=[0,0,0];for(let k=0;k<6;k++){const w=weights[k]/(sum||1);for(let q=0;q<3;q++)base[q]+=palette[k][q]*w}let flow=.5+.5*Math.sin(theta*27+rad*5+1.1*Math.sin(theta*12-t*.47)+t*.27);let vein=.5+.5*Math.sin(theta*17-rad*7+t*.24);let light=.78+.25*flow+.13*vein;return base.map(v=>Math.min(255,v*light))}
function render(ms){requestAnimationFrame(render);const dt=Math.min(.05,Math.max(0,(ms-last)/1000||0));last=ms;if(ms-lastFrame<33)return;lastFrame=ms;if(playing){state.fill=Math.max(0,state.fill-dt*3.2);inputs.fill.value=state.fill;document.getElementById('o_fill').textContent=Math.round(state.fill)+' %';if(state.fill===0){playing=false;play.textContent='▶ Testa nedräkning'}}phase+=dt*state.motion/55*.65;
ctx.clearRect(0,0,800,800);const r=282,th=26+state.thick*.43,inner=r-th/2,outer=r+th/2,end=START+TAU*state.fill/100;
let glass=ctx.createLinearGradient(130,110,700,700);glass.addColorStop(0,'#d3f2ff2b');glass.addColorStop(.4,'#b5c6ff10');glass.addColorStop(.7,'#ffc5ff18');glass.addColorStop(1,'#c4efff2c');arc(r,th,0,TAU,glass);
if(state.fill>0&&state.color>0){ctx.save();ctx.beginPath();ctx.arc(C,C,outer-4,START,end);ctx.arc(C,C,inner+4,end,START,true);ctx.closePath();ctx.clip();const angular=240,radial=13,coverage=state.color/100;
for(let i=0;i<angular;i++){let a=START+(i+.5)*TAU/angular,theta=(i+.5)/angular;if(theta>state.fill/100+.005)break;for(let j=0;j<radial;j++){let u=(j+.5)/radial;let col=pigment(theta,u,phase);let rr=inner+5+(th-10)*u;let aa=a-TAU/angular*.58,bb=a+TAU/angular*.58;let width=(th-10)/radial+1.7;let edgeShade=.56+.44*Math.sin(Math.PI*u);let opacity=coverage*(.78+.22*edgeShade);arc(rr,width,aa,bb,rgba(col,opacity));}}
// Viscous luminous cloud highlights: softly blended and fully clipped to the tube.
for(let k=0;k<7;k++){let a=START+TAU*((k/7+.045*Math.sin(phase*.31+k*1.8)+1)%1),rr=r+th*.20*Math.sin(phase*.43+k*2.1),x=C+Math.cos(a)*rr,y=C+Math.sin(a)*rr,rad=th*(.65+.2*Math.sin(phase*.25+k));let g=ctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,rgba(palette[k%6],coverage*.24));g.addColorStop(1,rgba(palette[k%6],0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,TAU);ctx.fill()}
ctx.restore();if(state.fill<99.9){const x=C+Math.cos(end)*r,y=C+Math.sin(end)*r;const g=ctx.createRadialGradient(x,y,0,x,y,th*.45);g.addColorStop(0,`rgba(125,224,255,${coverage*.42})`);g.addColorStop(1,'rgba(125,224,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,th*.45,0,TAU);ctx.fill()}}
// Fixed glass highlights: no solid white fill, no moving plastic stripe.
const edge=ctx.createLinearGradient(130,150,680,700);edge.addColorStop(0,'#eaffffcf');edge.addColorStop(.28,'#94c5ff80');edge.addColorStop(.55,'#fff3ffbb');edge.addColorStop(.8,'#a5d7ff75');edge.addColorStop(1,'#f8ffffc9');arc(outer-1,2.5,0,TAU,edge);arc(inner+1,2.3,0,TAU,edge);arc(outer-6,1.1,0,TAU,'#ffffff40');arc(inner+6,1.2,0,TAU,'#a7e9ff48');for(let k=0;k<7;k++){const a=-1.8+k*TAU/7;arc(k%2?inner+2:outer-2,2.6,a,a+.075,'#ffffff8c')}for(let k=0;k<5;k++){const a=-1.75+k*TAU/5.3,x=C+Math.cos(a)*outer,y=C+Math.sin(a)*outer;const radius=4+state.glow*.08,g=ctx.createRadialGradient(x,y,0,x,y,radius);g.addColorStop(0,'#ffffffb3');g.addColorStop(1,'#ffffff00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,radius,0,TAU);ctx.fill()}}
requestAnimationFrame(render);
</script></body></html>
