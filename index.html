<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kristallvätska · Test 6</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 40% 46%,#172039,#050713 75%);color:#f4f3ff;font:15px system-ui,Arial;display:flex;align-items:center;justify-content:center;gap:3vw;padding:24px}canvas{width:min(68vw,760px);height:auto;aspect-ratio:1}aside{width:290px;background:#121525e8;border:1px solid #53566b;border-radius:20px;padding:22px;box-shadow:0 20px 70px #0008}h2{margin:0 0 6px;font-size:21px}p{font-size:12px;color:#aeb3c9;line-height:1.5}label{display:flex;justify-content:space-between;margin-top:20px;font-size:13px}output{color:#ffaddc}input{width:100%;accent-color:#e59cd4;margin-top:8px}button{background:#31364e;color:white;border:1px solid #777b95;padding:9px 12px;border-radius:9px;margin-top:15px;cursor:pointer}@media(max-width:850px){body{flex-direction:column;padding:12px;gap:0}canvas{width:min(96vw,620px)}aside{width:min(94vw,420px);margin-bottom:20px}}</style><canvas id="ring" width="1000" height="1000"></canvas><aside><h2>💎 Kristallvätska · Test 6</h2><p>Stillbildsstudie: rundat kristallglas, inre vätska och djupa ljusreflexer. Animationen är pausad.</p><label>Fyllnadsgrad (tid kvar) <output id="fillO">75 %</output></label><input id="fill" type="range" min="0" max="100" value="75"><label>Färgtäckning <output id="colorO">100 %</output></label><input id="color" type="range" min="0" max="100" value="100"><label>Glöd <output id="glowO">55 %</output></label><input id="glow" type="range" min="0" max="100" value="55"><label>Ringens tjocklek <output id="thickO">55 %</output></label><input id="thick" type="range" min="0" max="100" value="55"><button id="reset">Återställ</button><p>Det här är en statisk jämförelse mot vår inspirationsbild. Färgen är klippt till vätskans fyllda del och glasröret finns kvar vid 0 %.</p></aside><script>
const c=document.getElementById('ring'),x=c.getContext('2d'),TAU=Math.PI*2,ids=['fill','color','glow','thick'];let state={fill:75,color:100,glow:55,thick:55};const cx=500,cy=500,R=350;
function arc(r,a,b){x.beginPath();x.arc(cx,cy,r,a,b)}function stroke(r,w,a,b,style,blur=0){x.save();x.strokeStyle=style;x.lineWidth=w;x.lineCap='round';x.shadowColor=style;x.shadowBlur=blur;arc(r,a,b);x.stroke();x.restore()}
function render(){x.clearRect(0,0,1000,1000);let w=57+state.thick*.43, inner=R-w/2,outer=R+w/2, start=-Math.PI/2, end=start+TAU*state.fill/100;
// A physically rounded glass tube, always present.
let base=x.createRadialGradient(cx-85,cy-120,inner-20,cx,cy,outer+35);base.addColorStop(0,'#0c1020');base.addColorStop(.74,'#141c31');base.addColorStop(.9,'#354258');base.addColorStop(1,'#060913');stroke(R,w,start,start+TAU,base);
stroke(R,w-7,start,start+TAU,'rgba(22,33,57,.65)');
// Color body: a continuous fill, not colored stripes. Its layered highlights make folds.
if(state.fill>0&&state.color>0){x.save();x.globalAlpha=state.color/100; x.beginPath();x.arc(cx,cy,outer-8,0,TAU);x.arc(cx,cy,inner+8,0,TAU,true);x.clip('evenodd');
let n=180;for(let i=0;i<n;i++){let a=start+(end-start)*(i+.5)/n;let hue=195+95*Math.sin(a*1.45+1.2)+95*Math.sin(a*.7+2.7);let h=((hue%360)+360)%360;let gradient=x.createLinearGradient(cx+Math.cos(a)*(inner-4),cy+Math.sin(a)*(inner-4),cx+Math.cos(a)*(outer+4),cy+Math.sin(a)*(outer+4));gradient.addColorStop(0,`hsla(${h},90%,18%,1)`);gradient.addColorStop(.2,`hsla(${h},94%,46%,1)`);gradient.addColorStop(.46,`hsla(${(h+24)%360},88%,57%,1)`);gradient.addColorStop(.74,`hsla(${h},92%,33%,1)`);gradient.addColorStop(1,`hsla(${h},90%,12%,1)`);stroke(R,w-16,a-.013,a+.013,gradient)}
// translucent folded liquid sheets with long, non-uniform boundaries
for(let j=0;j<8;j++){let a=start+.12+(end-start)*((j+.42)/9),span=.19+.07*(j%3);let rr=R+Math.sin(j*2.3)*w*.14;let col=['#9af9ff','#ffb85e','#f2a3ff','#86c9ff'][j%4];stroke(rr,w*.17,a-span,a+span,col,2);stroke(rr+w*.085,w*.06,a-span*.7,a+span*.5,'rgba(255,255,255,.24)',3)}
x.restore();}
// subtle internal shadow, glass walls, chromatic refractions
stroke(inner+4,8,start,start+TAU,'rgba(2,5,16,.65)');stroke(outer-4,10,start,start+TAU,'rgba(4,9,22,.65)');stroke(inner+1,2.4,start,start+TAU,'rgba(170,224,255,.75)',state.glow*.08);stroke(outer-1,3.4,start,start+TAU,'rgba(205,231,255,.78)',state.glow*.08);stroke(outer+3,1.2,start,start+TAU,'rgba(140,177,245,.7)');
// white glass specular arcs; reflections not a continuous opaque band
stroke(outer-8,6,-2.62,-1.92,'rgba(244,251,255,.82)',state.glow*.16);stroke(outer-15,3,-2.53,-1.82,'rgba(142,211,255,.62)',state.glow*.11);stroke(inner+8,3,-.83,-.23,'rgba(246,226,255,.65)',state.glow*.09);stroke(outer-10,3,.35,.9,'rgba(166,229,255,.48)',state.glow*.09);stroke(inner+9,3,1.05,1.72,'rgba(255,202,244,.44)',state.glow*.08);
// refracted glass glints, very sparse
for(let i=0;i<7;i++){let a=i*TAU/7-.5,r=outer-2;x.save();x.fillStyle='rgba(230,246,255,.52)';x.shadowColor='#a5dfff';x.shadowBlur=state.glow*.24;x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,1.5+(i%3),0,TAU);x.fill();x.restore()}
}
for(let id of ids){document.getElementById(id).addEventListener('input',e=>{state[id]=+e.target.value;document.getElementById(id+'O').textContent=state[id]+' %';render()})}document.getElementById('reset').onclick=()=>{state={fill:75,color:100,glow:55,thick:55};for(let id of ids){document.getElementById(id).value=state[id];document.getElementById(id+'O').textContent=state[id]+' %'}render()};render();
</script></html>
