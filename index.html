<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kristallvätska · Test 5</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 42% 48%,#1b2746,#080d1e 78%);color:#edf3ff;font:15px system-ui,-apple-system,sans-serif;min-height:100vh}.wrap{display:flex;align-items:center;justify-content:center;gap:5vw;min-height:100vh;padding:25px;flex-wrap:wrap}canvas{width:min(68vw,720px);height:auto;aspect-ratio:1;max-width:100%;display:block}.panel{background:#141a2c;border:1px solid #39415c;border-radius:20px;padding:24px;width:290px;box-shadow:0 12px 40px #0005}h2{font-size:20px;margin:0 0 6px}small{color:#aeb9d3}label{display:flex;justify-content:space-between;margin-top:20px;font-size:13px}output{color:#f2a5d5}input{width:100%;accent-color:#ee99cf;margin-top:10px}button{background:#343d5b;color:white;border:1px solid #66718d;border-radius:9px;padding:10px 12px;cursor:pointer;margin-top:15px}p{font-size:12px;line-height:1.6;color:#b2bfd5}@media(max-width:850px){.wrap{gap:0;padding:10px}canvas{width:min(95vw,630px)}.panel{width:min(95vw,430px);margin-bottom:20px}}</style></head><body><main class="wrap"><canvas id="ring" width="720" height="720" aria-label="Animerad glasring med flytande färger"></canvas><section class="panel"><h2>💎 Kristallvätska · Test 5</h2><small>Sammanhängande färgvätska · mjuk lavalampa</small><div id="controls"></div><button id="play">▶ Testa nedräkning</button> <button id="reset">↺ Återställ</button><p>0 % färgtäckning = färglöst glas. 100 % = hela vätskan färgad. Vid 0 % tid är glasröret kvar. Färgerna ska fylla hela vätskans tvärsnitt.</p></section></main><script>
const defs=[['Tid kvar / vätska','fill',75],['Färgtäckning','color',100],['Vätskans rörelse','motion',55],['Glöd','glow',45],['Ringens tjocklek','thick',55]];const state={};const controls=document.querySelector('#controls');for(const [name,key,val] of defs){state[key]=val;const label=document.createElement('label');label.innerHTML=`<span>${name}</span><output id="o-${key}">${val} %</output>`;const inp=document.createElement('input');inp.type='range';inp.min=0;inp.max=100;inp.value=val;inp.addEventListener('input',()=>{state[key]=+inp.value;document.getElementById('o-'+key).textContent=inp.value+' %'});controls.append(label,inp)}const cvs=document.querySelector('canvas'),ctx=cvs.getContext('2d');const N=720,C=360,R=268;const tex=document.createElement('canvas');tex.width=360;tex.height=360;const tx=tex.getContext('2d');let start=performance.now(),last=start,elapsed=0,playing=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const lerp=(a,b,t)=>a+(b-a)*t;function rgb(h){let a=(h%360+360)%360/60,x=1-Math.abs(a%2-1);let vals=a<1?[1,x,0]:a<2?[x,1,0]:a<3?[0,1,x]:a<4?[0,x,1]:a<5?[x,0,1]:[1,0,x];return vals.map(v=>Math.round(255*v))}
function frame(now){const dt=Math.min(.06,(now-last)/1000);last=now;if(playing){state.fill=Math.max(0,state.fill-dt*2.5);const input=controls.querySelectorAll('input')[0];input.value=state.fill;document.querySelector('#o-fill').textContent=Math.round(state.fill)+' %';if(state.fill===0){playing=false;document.querySelector('#play').textContent='▶ Testa nedräkning'}}elapsed+=dt*(state.motion/100);ctx.clearRect(0,0,N,N);let thick=lerp(29,80,state.thick/100),outer=R+thick/2,inner=R-thick/2;ctx.save();ctx.translate(C,C);
// glass body always visible
let glass=ctx.createRadialGradient(-75,-100,inner*.5,0,0,outer);glass.addColorStop(0,'#1c294855');glass.addColorStop(.72,'#e0eff811');glass.addColorStop(1,'#a7c8ef25');ctx.beginPath();ctx.arc(0,0,outer,0,Math.PI*2);ctx.arc(0,0,inner,0,Math.PI*2,true);ctx.fillStyle=glass;ctx.fill('evenodd');
if(state.fill>0&&state.color>0){let im=tx.createImageData(360,360),d=im.data;let coverage=state.color/100,filled=state.fill/100;let tm=elapsed*.45;for(let y=0;y<360;y++)for(let x=0;x<360;x++){let dx=(x-180)*2,dy=(y-180)*2,r=Math.hypot(dx,dy),ang=(Math.atan2(dy,dx)+Math.PI/2+Math.PI*2)%(Math.PI*2),progress=ang/(Math.PI*2);if(r<inner+4||r>outer-4||progress>filled)continue;let u=ang,v=(r-inner)/thick;let warp=Math.sin(u*2.7+Math.sin(u*1.3-tm*.8)*1.8+tm*.48)*.65+Math.sin(u*5.1-tm*.32+v*3)*.22;let blob=Math.sin(u*3.4+v*5.3+tm*.7+warp*2)+.55*Math.sin(u*6.3-v*6-tm*.36);let hue=190+105*Math.sin(u*.75+tm*.12)+95*Math.sin(u*1.65-tm*.19+v*1.5)+55*blob;let c=rgb(hue),light=.77+.2*Math.sin(u*2.2+v*5+tm*.32)+.15*blob;let edge=Math.pow(Math.abs(v-.5)*2,1.8);light*=1-.34*edge;let alpha=255*coverage;let idx=(y*360+x)*4;d[idx]=clamp(c[0]*light+20,0,255);d[idx+1]=clamp(c[1]*light+14,0,255);d[idx+2]=clamp(c[2]*light+30,0,255);d[idx+3]=alpha;}tx.putImageData(im,0,0);ctx.save();ctx.rotate(0);ctx.drawImage(tex,-360,-360,720,720);ctx.restore();}
// crystal highlights, all stationary
ctx.lineCap='round';for(const [rad,width,col] of [[outer,2.5,'#e6f5ffb0'],[inner,2.3,'#c4e8ffad'],[outer-5,1.2,'#ffffff65'],[inner+5,1.3,'#8bcfff80']]){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.stroke()}
ctx.strokeStyle='#ffffffa8';ctx.lineWidth=3;for(let a of [-2.3,-.5,1.2,2.9]){ctx.beginPath();ctx.arc(0,0,outer-2,a,a+.24);ctx.stroke()}ctx.strokeStyle='#bde8ff75';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,inner+2,-2.2,-1.25);ctx.stroke();ctx.beginPath();ctx.arc(0,0,outer-2,.3,.8);ctx.stroke();ctx.restore();requestAnimationFrame(frame)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Ⅱ Pausa':'▶ Testa nedräkning'};document.querySelector('#reset').onclick=()=>{playing=false;document.querySelector('#play').textContent='▶ Testa nedräkning';defs.forEach(([,k,v],i)=>{state[k]=v;controls.querySelectorAll('input')[i].value=v;document.querySelector('#o-'+k).textContent=v+' %'})};requestAnimationFrame(frame);
</script></body></html>
