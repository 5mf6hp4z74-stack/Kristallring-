<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kristallvätska – Ringtest 3</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 42% 38%,#19233d,#060811 72%);color:#f6f5ff;font:15px system-ui,-apple-system,sans-serif}.layout{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:22px;padding:20px}canvas{width:min(65vw,80vh);height:auto;aspect-ratio:1}aside{width:305px;max-width:100%;padding:21px;background:#141726ed;border:1px solid #ffffff36;border-radius:19px}h2{margin:0 0 7px;font-size:21px}p,.note{color:#aeb8cf;font-size:12px;line-height:1.5}p{margin:0 0 16px}label{display:flex;justify-content:space-between;margin:16px 0 7px}output{color:#f2a9d9}input[type=range]{width:100%;accent-color:#e6a1d5}button{margin:10px 5px 0 0;padding:10px 12px;border-radius:9px;background:#30364c;color:white;border:1px solid #ffffff55}.note{margin-top:17px}@media(max-width:850px){.layout{flex-direction:column;padding:12px;gap:3px}canvas{width:min(96vw,62vh)}aside{width:min(96vw,460px);padding:17px}}</style></head><body><div class="layout"><canvas id="c" width="800" height="800"></canvas><aside><h2>💎 Kristallvätska · Test 3</h2><p>Lavalampans långsamma färgflöde • separat från pianotimern</p><div id="controls"></div><button id="play">▶ Testa nedräkning</button><button id="reset">↺ Återställ</button><div class="note">Test 3: inget vitt vätskeband. Organiska färgformationer rör sig inuti ett stilla, genomskinligt glasrör. Vid 0 % färgtäckning är röret färglöst; vid 0 % tid är röret tomt.</div></aside></div><script>
const defs=[['fill','Tid kvar / vätska',75],['color','Färgtäckning',100],['motion','Vätskans rörelse',55],['glow','Glöd',45],['thick','Ringens tjocklek',55]];const state={};const inputs={};const controls=document.getElementById('controls');for(const [id,name,value] of defs){state[id]=value;const label=document.createElement('label');const nameSpan=document.createElement('span');nameSpan.textContent=name;const out=document.createElement('output');out.id='o_'+id;out.textContent=value+' %';label.append(nameSpan,out);const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=100;slider.value=value;slider.addEventListener('input',()=>{state[id]=+slider.value;out.textContent=slider.value+' %'});inputs[id]=slider;controls.append(label,slider)}let playing=false;const play=document.getElementById('play');play.onclick=()=>{if(state.fill===0)state.fill=100;playing=!playing;play.textContent=playing?'⏸ Pausa':'▶ Testa nedräkning'};document.getElementById('reset').onclick=()=>{playing=false;play.textContent='▶ Testa nedräkning';for(const [id,,value] of defs){state[id]=value;inputs[id].value=value;document.getElementById('o_'+id).textContent=value+' %'}};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:true}),TAU=Math.PI*2,C=400;let phase=0,last=0;const colors=['#0ae4ed','#266eff','#933eff','#fa40b8','#ffac37','#08d8c8'];const rgb=colors.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);function mix(a,b,t){return a.map((v,i)=>Math.round(v*(1-t)+b[i]*t))}function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function ringArc(r,w,start,end,style){ctx.beginPath();ctx.arc(C,C,r,start,end);ctx.strokeStyle=style;ctx.lineWidth=w;ctx.lineCap='butt';ctx.stroke()}
function draw(ms){const dt=Math.min(.05,Math.max(0,(ms-last)/1000||0));last=ms;if(playing){state.fill=Math.max(0,state.fill-dt*3.4);if(!state.fill){playing=false;play.textContent='▶ Testa nedräkning'}inputs.fill.value=state.fill;document.getElementById('o_fill').textContent=Math.round(state.fill)+' %'}phase+=dt*state.motion/55*.50;
ctx.clearRect(0,0,800,800);const r=282,th=24+state.thick*.47,inner=r-th/2,outer=r+th/2,start=-Math.PI/2,end=start+TAU*state.fill/100;
// Clear crystal tube, independent from liquid and countdown.
const glass=ctx.createLinearGradient(150,120,690,680);glass.addColorStop(0,'#b5e6ff24');glass.addColorStop(.3,'#c4ddff0d');glass.addColorStop(.65,'#e8baff19');glass.addColorStop(1,'#b9e9ff22');ringArc(r,th,start,start+TAU,glass);
if(state.fill>.001){ctx.save(); // precise annular liquid mask with flat, not white, endpoints
ctx.beginPath();ctx.arc(C,C,outer-5,start,end,false);ctx.arc(C,C,inner+5,end,start,true);ctx.closePath();ctx.clip();
const strength=state.color/100;
// Build the flowing pigment out of many short, overlapping colored cells, with no white substrate.
const count=180;for(let j=0;j<count;j++){const a=start+TAU*(j+.5)/count;const drift=phase*.22;const n=(a-start)/TAU*colors.length;const wobble=.23*Math.sin(a*3.2+phase*.9)+.13*Math.sin(a*5.3-phase*.57);const pos=((n+wobble+drift)%colors.length+colors.length)%colors.length;const idx=Math.floor(pos),f=pos-idx;const col=mix(rgb[idx],rgb[(idx+1)%colors.length],f);const radialShift=Math.sin(a*4.7-phase*1.2)*th*.075+Math.sin(a*2.3+phase*.65)*th*.055;const band=th*.77;ctx.save();ctx.shadowColor=rgba(col,.5*strength);ctx.shadowBlur=state.glow*.14;ringArc(r+radialShift,band,a-.024,a+.024,rgba(col,.93*strength));ctx.restore()}
// Large translucent, slowly stretching and merging lava-like shapes.
for(let k=0;k<11;k++){const a=start+TAU*(k/11)+Math.sin(phase*.47+k*1.8)*.085;const rr=r+Math.sin(phase*.83+k*2.2)*th*.16;const x=C+Math.cos(a)*rr,y=C+Math.sin(a)*rr;const radius=th*(.55+.2*Math.sin(phase*.6+k));const g=ctx.createRadialGradient(x,y,0,x,y,radius);const col=rgb[(k+Math.floor(k/3))%rgb.length];g.addColorStop(0,rgba(col,.56*strength));g.addColorStop(.6,rgba(col,.27*strength));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,radius,0,TAU);ctx.fill()}
// Internal curved filaments drift independently, making the fluid look viscous.
for(let k=0;k<5;k++){ctx.beginPath();const segments=240;for(let i=0;i<=segments;i++){const a=start+TAU*i/segments;const shift=Math.sin(a*(3+k*.37)-phase*(.7+k*.1)+k*2.2)*th*.16+Math.sin(a*6+phase*.38+k)*th*.06;const rr=r+(k-2)*th*.125+shift;const x=C+Math.cos(a)*rr,y=C+Math.sin(a)*rr;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.strokeStyle=rgba(rgb[(k+1)%6],strength*.32);ctx.lineWidth=th*.13;ctx.stroke()}
ctx.restore();
// Slightly luminous, curved fluid meniscus at the trailing edge; never white.
if(state.fill<99.9){const x=C+Math.cos(end)*r,y=C+Math.sin(end)*r;const g=ctx.createRadialGradient(x,y,0,x,y,th*.43);g.addColorStop(0,`rgba(79,219,245,${.55*strength})`);g.addColorStop(1,'rgba(79,219,245,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,th*.43,0,TAU);ctx.fill()}}
// Stationary crisp optical reflections on the outer and inner crystal edges.
const edge=ctx.createLinearGradient(140,160,680,700);edge.addColorStop(0,'#f4ffffc8');edge.addColorStop(.28,'#94c5ff6b');edge.addColorStop(.53,'#fff4ffb0');edge.addColorStop(.78,'#a5d7ff65');edge.addColorStop(1,'#f8ffffcb');ringArc(outer-1,2.6,0,TAU,edge);ringArc(inner+1,2.2,0,TAU,edge);ringArc(outer-6,1.2,0,TAU,'#ffffff42');ringArc(inner+6,1,0,TAU,'#b8e9ff45');for(let k=0;k<8;k++){const a=-1.7+k*TAU/8;ringArc(k%2?inner+2:outer-2,2.4,a,a+.09,'#ffffff8a')}for(let k=0;k<5;k++){const a=-1.75+k*TAU/5.3,x=C+Math.cos(a)*outer,y=C+Math.sin(a)*outer;const g=ctx.createRadialGradient(x,y,0,x,y,5+state.glow*.07);g.addColorStop(0,'#ffffff94');g.addColorStop(1,'#ffffff00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,5+state.glow*.07,0,TAU);ctx.fill()}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
